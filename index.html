<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6336c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g0:#a61e4d;--g1:#d6336c;--g2:#f783ac;--g3:#ff8fb8;--glow:214,51,108;--glow3:255,143,184;--bg:#fff0f5;--card:#fff;--ink:#3d1d2e;--mute:#8d6479;--acc:var(--g1);--ok:#2f9e6b;--line:#f7d1e0;--chip:#fde2ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1218;--card:#2b1a23;--ink:#fbeef3;--mute:#c9a3b4;--acc:#ff85b3;--ok:#55d198;--line:#44283a;--chip:#3a2230}}
:root[data-theme="dark"]{--bg:#1f1218;--card:#2b1a23;--ink:#fbeef3;--mute:#c9a3b4;--acc:#ff85b3;--ok:#55d198;--line:#44283a;--chip:#3a2230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:28px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:20px;font-weight:800;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:12px;cursor:pointer}
nav button.on{background:var(--chip);color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.week{display:flex;gap:6px;margin:10px 0 4px}
.dot{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.dot i{display:block;height:34px;border-radius:10px;background:var(--chip);margin-bottom:3px;position:relative;overflow:hidden}
.dot i b{position:absolute;left:0;right:0;bottom:0;background:var(--ok)}
.dot.today{color:var(--acc);font-weight:800}
.dot.today i{outline:2px solid var(--acc)}
.bar{height:10px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--ok);transition:width .3s}
label.row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
label.row:first-of-type{border-top:0}
label.row input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
label.row span small{display:block;color:var(--mute)}
label.row input:checked+span{text-decoration:line-through;opacity:.55}
.cnt{display:flex;align-items:center;gap:10px}
.cnt button,.btn{border:0;background:var(--acc);color:#fff;font:600 16px inherit;font-family:inherit;border-radius:12px;padding:10px 16px;cursor:pointer}
.cnt button{width:42px;padding:8px}
.cnt output{font-size:22px;font-weight:800;min-width:70px;text-align:center}
.daybtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:16px}
.daybtn b{display:block}
.daybtn small{color:var(--mute)}
.daybtn.open{border-color:var(--acc)}
ul.ex{margin:8px 0 0;padding-left:20px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stats strong{display:block;font-size:22px;font-weight:800}
.stats small{color:var(--mute)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fields label{font-size:13px;color:var(--mute);display:block}
input[type=number]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px inherit;font-family:inherit}
.entry{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.entry button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--mute)}
.hide{display:none}
.yt{display:inline-block;margin-top:3px;color:var(--acc);font-weight:600;font-size:14px}
.mc{display:block;color:var(--mute);font-size:13px}
.dayw{margin-bottom:8px}
.dayw .daybtn{margin-bottom:0}
.daylist{border:1px solid var(--acc);border-top:0;border-radius:0 0 14px 14px;background:var(--card);padding:6px 14px 12px}
.daylist div.it{padding:9px 0;border-top:1px solid var(--line)}
.daylist div.it:first-child{border-top:0}

h1{font-size:22px;margin:4px 0 0}
.hero{background:linear-gradient(135deg,var(--g0),var(--g1) 60%,var(--g3));color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;overflow:hidden;margin-bottom:14px}
.hero .bg{position:absolute;right:-24px;bottom:-34px;width:190px;opacity:.13}
.hero .hi{font-size:14px;opacity:.85}
.hero .ft{font-size:24px;font-weight:800;line-height:1.15;margin:2px 0 10px}
.hero .chips span{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:13px;margin:0 6px 4px 0}
.hero .ring{position:relative;flex:none}
.ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2))}
.fxw{display:flex;gap:12px;align-items:flex-start}
.fxw .tx{flex:1}
.daybtn{background:var(--g);color:#fff;border:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-radius:18px;position:relative;overflow:hidden}
.daybtn small{color:rgba(255,255,255,.85);font-size:14px}
.daybtn b{font-size:18px}
.daybtn .big{position:absolute;right:-8px;bottom:-14px;width:84px;height:84px;opacity:.18}
.daybtn.open{border-radius:18px 18px 0 0}
.daybtn .ic{background:rgba(255,255,255,.22);position:relative}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:22px;padding:6px;max-width:496px;margin:0 auto;box-shadow:0 8px 30px rgba(var(--glow),.25)}
nav button.on{background:var(--acc);color:#fff}
.stats div{background:linear-gradient(135deg,var(--chip),var(--card));border:1px solid var(--line)}
.card{border-radius:20px}
nav button{padding:10px 4px;font-size:14px}
.mchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.mchips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;border-radius:20px;padding:8px 14px;cursor:pointer}
.mchips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.meal{display:flex;gap:14px;align-items:flex-start}
.meal h2{margin:0}
.meal input{width:24px;height:24px;accent-color:var(--ok);flex:none;margin-top:4px}
body{background:radial-gradient(circle at 92% -4%,rgba(var(--glow3),.4),transparent 42%),radial-gradient(circle at -12% 32%,rgba(var(--glow),.13),transparent 40%),var(--bg);background-attachment:fixed}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes rg{from{stroke-dashoffset:var(--from,226.2)}}
.ring circle:nth-child(2){animation:rg 1.3s ease-out}
.card{box-shadow:0 8px 26px rgba(var(--glow),.09);border-radius:24px;padding:18px}
.hero{border-radius:28px;padding:22px;box-shadow:0 14px 34px rgba(var(--glow),.35)}
.hero::before{content:"";position:absolute;left:-46px;top:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::after{content:"";position:absolute;right:70px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hero .bg{z-index:0}
.hero .ft{font-size:26px;letter-spacing:-.4px}
.hero .q{font-size:13px;opacity:.92;margin-top:6px;font-style:italic;max-width:210px}
.dot i{height:auto;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.dot.today i{outline:2px solid var(--acc);outline-offset:2px}
label.row input[type=checkbox],.meal input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--acc);border-radius:9px;background:var(--card);display:grid;place-items:center;flex:none;cursor:pointer;transition:background .15s}
label.row input[type=checkbox]:checked,.meal input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
label.row input[type=checkbox]:checked::after,.meal input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.drops{display:flex;gap:4px}
.drops button{flex:1;border:0;background:none;padding:2px;cursor:pointer}
.drops svg{width:100%;fill:var(--chip);stroke:var(--acc);stroke-width:1.6;transition:fill .2s}
.drops button.on svg{fill:var(--acc)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 18px rgba(var(--glow),.3);border-radius:14px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 4px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:12px}
.bar div{background:linear-gradient(90deg,var(--g2),var(--g1))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn.alt{background:var(--chip);color:var(--acc);box-shadow:none}
textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px inherit;font-family:inherit;margin:8px 0;resize:vertical}
input[type=file]{width:100%;margin-top:6px;font-family:inherit;color:var(--mute)}
input[type=text],select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px inherit;font-family:inherit}
.scale{background:linear-gradient(90deg,#74c0fc 0 14%,#69db7c 14% 40%,#ffd43b 40% 60%,#ff6b6b 60%);height:14px;border-radius:9px;position:relative;margin:26px 0 6px}
.scale i{position:absolute;top:-8px;width:6px;height:30px;background:var(--ink);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--card)}
.sl{display:grid;grid-template-columns:14fr 26fr 20fr 40fr;font-size:12px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{text-align:right}
details summary{cursor:pointer;font-weight:600;color:var(--acc)}
.warn{background:var(--chip);border-radius:14px;padding:12px;margin:10px 0 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dp{flex:none;width:60px;height:60px;border-radius:50%;border:3px solid var(--acc);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font:800 24px inherit;font-family:inherit;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 6px 16px rgba(var(--glow),.3)}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.dp span{display:grid;place-items:center;width:100%;height:100%}
.top h1{margin:0}

#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--g0),var(--g1) 55%,var(--g3));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:sp .6s ease 1.5s forwards}
#splash .lift{animation:lift .75s cubic-bezier(.5,0,.5,1) infinite alternate;transform-origin:60px 35px}
#splash .spt{font-size:30px;font-weight:800;letter-spacing:-.5px;animation:up .7s .15s both}
#splash .sps{opacity:.85;animation:up .7s .3s both}
@keyframes sp{to{opacity:0;visibility:hidden}}
@keyframes lift{from{transform:translateY(8px) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes tick{0%{transform:rotate(45deg) scale(0)}60%{transform:rotate(45deg) scale(1.5)}100%{transform:rotate(45deg) scale(1)}}
@keyframes dpb{0%{transform:scale(1)}35%{transform:scale(1.35) translateY(-4px)}100%{transform:scale(1)}}
@keyframes bw{from{width:var(--fw,0%)}}
@keyframes opn{from{opacity:0;transform:translateY(-10px)}}
@keyframes fl{from{transform:translateY(0) rotate(0)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes gs{from{background-position:0 0}to{background-position:100% 100%}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes fi2{from{opacity:0;transform:scale(0)}}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
.enter>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.enter>:nth-child(2){animation-delay:70ms}.enter>:nth-child(3){animation-delay:140ms}.enter>:nth-child(4){animation-delay:210ms}.enter>:nth-child(5){animation-delay:280ms}.enter>:nth-child(6){animation-delay:350ms}.enter>:nth-child(7){animation-delay:420ms}.enter>:nth-child(8){animation-delay:490ms}.enter>:nth-child(9){animation-delay:560ms}
.enter .hero .chips span{animation:pop .5s both}
.enter .hero .chips span:nth-child(1){animation-delay:.3s}.enter .hero .chips span:nth-child(2){animation-delay:.4s}.enter .hero .chips span:nth-child(3){animation-delay:.5s}
.hero{background-size:220% 220%;animation:gs 10s ease-in-out infinite alternate}
.enter>.hero{animation:up .6s cubic-bezier(.2,.8,.2,1) both,gs 10s ease-in-out infinite alternate}
.hero .bg{animation:fl 5s ease-in-out infinite alternate}
.bar div{animation:bw .8s cubic-bezier(.2,.8,.2,1)}
.card.pop{animation:pop .6s both}
input.pop:checked::after{animation:tick .4s}
.drops button.pop svg{animation:dpb .5s}
.daylist{animation:opn .35s ease-out}
polyline.draw{stroke-dasharray:1;animation:dr 1.3s ease-out both}
circle.pt{animation:fi2 .4s 1.1s both;transform-box:fill-box;transform-origin:center}
.scale i{transition:left 1.4s cubic-bezier(.2,.9,.3,1.15)}
button:active,.daybtn:active,.mchips button:active{transform:scale(.96)}
.btn,button{transition:transform .15s}
.dp{transition:transform .2s}.dp:hover{transform:scale(1.06) rotate(-3deg)}
nav{overflow:hidden}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:17px;transition:transform .45s cubic-bezier(.3,1.35,.5,1);z-index:0;box-shadow:0 6px 14px rgba(var(--glow),.35)}
nav button{position:relative;z-index:1}
nav button.on{background:none;color:#fff}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cf 2s ease-in forwards}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
.dot i{background:conic-gradient(var(--ok) calc(var(--p,0)*1%),var(--chip) 0);display:grid;place-items:center;padding:3px;overflow:visible;box-shadow:none}
.dot i span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);color:var(--acc)}
.dot i.full span{background:var(--ok);color:#fff;animation:pop .5s}
.dot.today i span{background:var(--chip)}
.dot.today i.full span{background:var(--ok)}

:root[data-g="M"]{--g0:#0b1f4d;--g1:#1d4ed8;--g2:#60a5fa;--g3:#38bdf8;--glow:29,78,216;--glow3:56,189,248;--bg:#eef4ff;--ink:#0f1c3a;--mute:#5d6b8a;--line:#d3e1fb;--chip:#e0eaff}
@media (prefers-color-scheme:dark){:root[data-g="M"]:not([data-theme="light"]){--bg:#0b1324;--card:#131f38;--ink:#eaf1ff;--mute:#9db0d6;--acc:#6ea8ff;--line:#223559;--chip:#1b2a4a}}
:root[data-g="M"][data-theme="dark"]{--bg:#0b1324;--card:#131f38;--ink:#eaf1ff;--mute:#9db0d6;--acc:#6ea8ff;--line:#223559;--chip:#1b2a4a}
pre.rep{white-space:pre-wrap;background:var(--chip);border-radius:14px;padding:12px;font:14px/1.5 inherit;font-family:inherit;margin:10px 0;max-height:270px;overflow:auto}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 8px 18px rgba(37,211,102,.35)}
input[type=tel]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px inherit;font-family:inherit;margin-top:4px}
.repimg{width:100%;aspect-ratio:1080/1740;border-radius:18px;display:block;margin:12px 0;background:var(--chip);box-shadow:0 8px 24px rgba(var(--glow),.2)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.hgrid>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}
.hgrid b{display:block;font-size:22px;line-height:1.1}
.hgrid small{color:var(--mute)}
.hform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.hform label{font-size:13px;color:var(--mute);display:block}
.hform input{margin-top:3px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 120 70" width="150" height="88"><g class="lift" fill="#fff"><rect x="22" y="31" width="76" height="8" rx="4"/><rect x="14" y="14" width="14" height="42" rx="6"/><rect x="92" y="14" width="14" height="42" rx="6"/><rect x="2" y="22" width="12" height="26" rx="5"/><rect x="106" y="22" width="12" height="26" rx="5"/></g></svg><div class="spt">Gym Tracker</div><div class="sps">Stronger every day</div></div>
<main>
<section id="setup" class="hide"></section>
<header class="top"><button class="dp" id="dpb" aria-label="Change profile photo"><span id="dpi"></span></button><div><h1 id="title">Gym Tracker</h1><p class="sub" id="sub" style="margin:0"></p></div></header>
<input type="file" id="dpf" accept="image/*" class="hide">
<section id="today"></section>
<section id="plan" class="hide"></section>
<section id="meals" class="hide"></section>
<section id="health" class="hide"></section>
<section id="prog" class="hide"></section>
</main>
<nav>
<i id="pill" aria-hidden="true"></i>
<button data-t="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Today</span></button>
<button data-t="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span></button>
<button data-t="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg><span>Meals</span></button>
<button data-t="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><span>Health</span></button>
<button data-t="prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg><span>Progress</span></button>
</nav>
<script>
var PLAN=[
{n:"Monday",t:"Full body strength",x:["Warm-up: brisk walk 5 min","Squats: 3 x 12","Push-ups (on knees is fine): 3 x 10","Dumbbell rows: 3 x 12","Plank: 3 x 30 sec","Cool-down stretch 5 min"]},
{n:"Tuesday",t:"Cardio and core",x:["Brisk walk or treadmill: 30 min","Crunches: 3 x 15","Bicycle crunches: 3 x 20","Leg raises: 3 x 12","Cool-down stretch 5 min"]},

 h+='<div class="card"><h2>History</h2>';
 if(!L.length)h+='<p class="note">No entries yet. Add the first weigh-in above.</p>';
 L.slice().reverse().forEach(function(e){h+='<div class="entry"><span>'+e.d+'</span><span>'+e.w+' kg'+(e.c?' / waist '+e.c+' cm':'')+'</span><button data-del="'+e.d+'" aria-label="Delete entry">&#10005;</button></div>'});
 h+='<p class="note" style="margin-top:12px">This is general fitness guidance, not medical advice. If you have any health condition or pain, check with a doctor first.</p></div>';
 h+='<div class="card"><h2>Backup and restore</h2><p class="note" style="margin:0">Your progress lives on this phone only. Save a backup now and then, so it is safe if the phone changes or browser data is cleared.</p><div class="bk">'+(DL?'<button class="btn" id="bkdl">Download backup file</button>':'')+'<button class="btn alt" id="bkcp">Copy backup code</button></div><p class="note" style="margin:0">To restore, choose a backup file or paste the code, then tap Restore. Restoring merges with what is already here.</p><input type="file" id="bkf" accept=".json,application/json" aria-label="Choose backup file"><textarea id="bkt" rows="3" placeholder="Paste backup code here" aria-label="Backup code"></textarea><button class="btn" id="bkrs">Restore</button><p id="bkm" class="note" role="status"></p></div>';
 $("prog").innerHTML=h;renderRepImg();
}
